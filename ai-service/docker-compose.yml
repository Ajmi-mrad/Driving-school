# Tag json-file avec le nom du conteneur : le collecteur OTel en fait le label Loki service_name.
x-logging: &logging
  options:
    tag: "{{.Name}}"

services:
  # Assistant Ops IA (lecture seule). Prérequis : stack auth-service (Keycloak, Eureka) et
  # stack observability (serveur MCP Grafana) démarrées, sur le réseau partagé.
  ai-service:
    logging: *logging
    build: .
    container_name: ai-service
    environment:
      # Secrets lus depuis ai-service/.env (non versionné, voir .env.example).
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY manquant dans ai-service/.env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
      # LLM de secours (optionnel) : bascule automatique si Groq échoue.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      # Synthèse vocale du rapport (optionnel).
      MURF_API_KEY: ${MURF_API_KEY:-}
      MURF_VOICE_ID: ${MURF_VOICE_ID:-en-US-natalie}
      GRAFANA_MCP_URL: http://mcp-grafana:8000
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/auto-ecole/protocol/openid-connect/certs
      SERVER_PORT: 8086
      EUREKA_ENABLED: "true"
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - auto-ecole

# Réseau partagé créé par la stack auth-service (contient Keycloak).
networks:
  auto-ecole:
    external: true
    name: auth-service_auto-ecole
